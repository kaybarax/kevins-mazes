const vertex=`attribute vec3 position; attribute vec3 normal; attribute vec2 uv; uniform float yaw; uniform float tilt; uniform float zoom; uniform float aspect; uniform float wallHeight; varying vec3 n; varying vec2 tex; void main(){vec3 p=position; p.y*=wallHeight; float c=cos(yaw),s=sin(yaw); vec3 r=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z); float ct=cos(tilt),st=sin(tilt); vec3 q=vec3(r.x,ct*r.y-st*r.z,st*r.y+ct*r.z); float fit=min(1.0,aspect/1.5); gl_Position=vec4(q.x*zoom*fit/aspect,q.y*zoom*fit,-q.z/8.0,1.0); n=normal; tex=uv;}`;
const fragment=`precision mediump float; varying vec3 n; varying vec2 tex; uniform sampler2D art; uniform bool floorPass; void main(){if(floorPass){gl_FragColor=texture2D(art,tex);}else{float light=0.62+0.38*max(0.0,dot(normalize(n),normalize(vec3(-0.4,1.0,0.5)))); gl_FragColor=vec4(vec3(0.247059,0.054902,0.435294)*light,1.0);}}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const uniforms={};for(const key of ['yaw','tilt','zoom','aspect','wallHeight','floorPass','art'])uniforms[key]=gl.getUniformLocation(program,key);
const attrs=['position','normal','uv'].map(k=>gl.getAttribLocation(program,k));
const data=[];
function point(x,y,h=0){return [(x-1000)/1000,h,(y-720)/1000];}
function vert(p,n,uv=[0,0]){data.push(...p,...n,...uv)}
function quad(a,b,c,d,n,uvs){for(const i of [0,1,2,0,2,3])vert([a,b,c,d][i],n,uvs?uvs[i]:[0,0]);}
quad(point(0,0),point(2000,0),point(2000,1440),point(0,1440),[0,1,0],[[0,0],[1,0],[1,1],[0,1]]);
const floorCount=data.length/8;
document.querySelector('#source').innerHTML=SVG_SOURCE;
const source=document.querySelector('#source svg'), walls=source.querySelector('g');
for(const path of walls.querySelectorAll('path')){
 const length=path.getTotalLength(); if(length<.01)continue;
 const count=Math.max(1,Math.ceil(length/4)), pts=[];
 for(let i=0;i<=count;i++){const p=path.getPointAtLength(length*i/count);pts.push([p.x+100,p.y+45]);}
 const offsets=pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(count,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;return [-dy/len*2.25,dx/len*2.25];});
 for(let i=0;i<count;i++){
  const a=pts[i],b=pts[i+1],oa=offsets[i],ob=offsets[i+1];
  const al=[a[0]+oa[0],a[1]+oa[1]],ar=[a[0]-oa[0],a[1]-oa[1]],bl=[b[0]+ob[0],b[1]+ob[1]],br=[b[0]-ob[0],b[1]-ob[1]];
  quad(point(...al,1),point(...bl,1),point(...br,1),point(...ar,1),[0,1,0]);
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz)||1;
  quad(point(...al),point(...bl),point(...bl,1),point(...al,1),[-dz/len,0,dx/len]);
  quad(point(...br),point(...ar),point(...ar,1),point(...br,1),[dz/len,0,-dx/len]);
  if(i===0)quad(point(...ar),point(...al),point(...al,1),point(...ar,1),[-dx/len,0,-dz/len]);
  if(i===count-1)quad(point(...bl),point(...br),point(...br,1),point(...bl,1),[dx/len,0,dz/len]);
 }
}
const vertexCount=data.length/8;
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
for(let i=0;i<3;i++){gl.enableVertexAttribArray(attrs[i]);gl.vertexAttribPointer(attrs[i],[3,3,2][i],gl.FLOAT,false,32,[0,12,24][i]);}
const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const image=new Image(),url=URL.createObjectURL(new Blob([SVG_SOURCE],{type:'image/svg+xml'}));
try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('Embedded maze image could not load'));image.src=url;});gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);}finally{URL.revokeObjectURL(url);}
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(0,0,0,0);
let yaw=-.10,tilt=1.12,zoom=1.35,wallHeight=.010,pending=false;
function draw(){pending=false;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.tilt,tilt);gl.uniform1f(uniforms.zoom,zoom);gl.uniform1f(uniforms.aspect,w/h);gl.uniform1f(uniforms.wallHeight,wallHeight);gl.uniform1i(uniforms.art,0);gl.uniform1i(uniforms.floorPass,1);gl.drawArrays(gl.TRIANGLES,0,floorCount);gl.uniform1i(uniforms.floorPass,0);gl.drawArrays(gl.TRIANGLES,floorCount,vertexCount-floorCount);}
function update(){if(!pending){pending=true;requestAnimationFrame(draw);}}
function setZoom(value){zoom=Math.max(.6,Math.min(5,value));update();}
const pointers=new Map();
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),next=[e.clientX,e.clientY];if(pointers.size===2){const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1];const before=Math.hypot(old[0]-other[0],old[1]-other[1]);const after=Math.hypot(next[0]-other[0],next[1]-other[1]);if(before>0)setZoom(zoom*after/before);}else{yaw+=(next[0]-old[0])*.005;tilt=Math.max(.18,Math.min(Math.PI/2,tilt+(next[1]-old[1])*.005));}pointers.set(e.pointerId,next);update();});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-Math.max(-100,Math.min(100,e.deltaY))*.0015));},{passive:false});
function reset(){yaw=-.1;tilt=1.12;zoom=1.35;update();}
document.querySelector('#reset').onclick=reset;document.querySelector('#top').onclick=()=>{yaw=0;tilt=Math.PI/2;zoom=1.35;update();};document.querySelector('#plus').onclick=()=>setZoom(zoom*1.15);document.querySelector('#minus').onclick=()=>setZoom(zoom/1.15);
document.querySelector('#height').oninput=e=>{wallHeight=Number(e.target.value)/1000;document.querySelector('#heightValue').value=e.target.value;update();};
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','r','R'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.1;if(e.key==='ArrowRight')yaw+=.1;if(e.key==='ArrowUp')tilt=Math.min(Math.PI/2,tilt+.1);if(e.key==='ArrowDown')tilt=Math.max(.18,tilt-.1);if(e.key==='+'||e.key==='=')setZoom(zoom*1.15);if(e.key==='-')setZoom(zoom/1.15);if(e.key.toLowerCase()==='r')reset();update();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='The 3D view was interrupted. Reload this page to restore it.';});
new ResizeObserver(update).observe(canvas);status.hidden=true;update();
}
</script></body></html>
