function draw(){pending=false;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.tilt,tilt);gl.uniform1f(uniforms.zoom,zoom);gl.uniform1f(uniforms.aspect,w/h);gl.uniform1f(uniforms.wallHeight,wallHeight);gl.uniform1i(uniforms.art,0);gl.uniform1i(uniforms.floorPass,1);gl.drawArrays(gl.TRIANGLES,0,floorCount);gl.uniform1i(uniforms.floorPass,0);gl.drawArrays(gl.TRIANGLES,floorCount,vertexCount-floorCount);}
function update(){if(!pending){pending=true;requestAnimationFrame(draw);}}
function setZoom(value){zoom=Math.max(.6,Math.min(5,value));update();}
const pointers=new Map();
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),next=[e.clientX,e.clientY];if(pointers.size===2){const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1];const before=Math.hypot(old[0]-other[0],old[1]-other[1]);const after=Math.hypot(next[0]-other[0],next[1]-other[1]);if(before>0)setZoom(zoom*after/before);}else{yaw+=(next[0]-old[0])*.005;tilt=Math.max(.18,Math.min(Math.PI/2,tilt+(next[1]-old[1])*.005));}pointers.set(e.pointerId,next);update();});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-Math.max(-100,Math.min(100,e.deltaY))*.0015));},{passive:false});
function reset(){yaw=-.1;tilt=1.12;zoom=1.35;update();}
document.querySelector('#reset').onclick=reset;document.querySelector('#top').onclick=()=>{yaw=0;tilt=Math.PI/2;zoom=1.35;update();};document.querySelector('#plus').onclick=()=>setZoom(zoom*1.15);document.querySelector('#minus').onclick=()=>setZoom(zoom/1.15);
document.querySelector('#height').oninput=e=>{wallHeight=Number(e.target.value)/1000;document.querySelector('#heightValue').value=e.target.value;update();};
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','r','R'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.1;if(e.key==='ArrowRight')yaw+=.1;if(e.key==='ArrowUp')tilt=Math.min(Math.PI/2,tilt+.1);if(e.key==='ArrowDown')tilt=Math.max(.18,tilt-.1);if(e.key==='+'||e.key==='=')setZoom(zoom*1.15);if(e.key==='-')setZoom(zoom/1.15);if(e.key.toLowerCase()==='r')reset();update();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='The 3D view was interrupted. Reload this page to restore it.';});
new ResizeObserver(update).observe(canvas);status.hidden=true;update();
}
</script></body></html>
