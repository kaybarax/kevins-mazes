document.querySelector('#reset').onclick=reset;document.querySelector('#top').onclick=()=>{yaw=0;tilt=Math.PI/2;zoom=1.35;update();};document.querySelector('#plus').onclick=()=>setZoom(zoom*1.15);document.querySelector('#minus').onclick=()=>setZoom(zoom/1.15);

canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','r','R'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.1;if(e.key==='ArrowRight')yaw+=.1;if(e.key==='ArrowUp')tilt=Math.min(Math.PI/2,tilt+.1);if(e.key==='ArrowDown')tilt=Math.max(.18,tilt-.1);if(e.key==='+'||e.key==='=')setZoom(zoom*1.15);if(e.key==='-')setZoom(zoom/1.15);if(e.key.toLowerCase()==='r')reset();update();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='The 3D view was interrupted. Reload this page to restore it.';});
new ResizeObserver(update).observe(canvas);status.hidden=true;update();
}
</script></body></html>
