name: Deployment helper checks
on:
  push:
    paths: ['scripts/**', '.github/workflows/deployment-checks.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/deployment-checks.yml']
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/deploy.test.mjs
