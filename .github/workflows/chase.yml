name: Maze Chase checks
on:
  push:
    paths: ['maze-chase/**', '.github/workflows/chase.yml']
  pull_request:
    paths: ['maze-chase/**', '.github/workflows/chase.yml']
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maze-chase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maze-chase/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
