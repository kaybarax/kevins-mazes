name: Cahuna checks
on:
  push:
    paths: ['big-cahuna/**', '.github/workflows/cahuna.yml']
  pull_request:
    paths: ['big-cahuna/**', '.github/workflows/cahuna.yml']
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: big-cahuna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: big-cahuna/package-lock.json
      - run: npm ci
      - run: npm test
